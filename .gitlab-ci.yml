stages:
  - test
  - deploy

# Real Chromium from the Playwright image; the version matches playwright-core
# in package.json.
browser_tests:
  stage: test
  image: mcr.microsoft.com/playwright:v1.48.2-jammy
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - node --version
    - npm ci --cache .npm --prefer-offline
    - npm test
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - test-artifacts/

# GitLab Pages: only from the default branch, after the tests pass.
pages:
  stage: deploy
  image: node:22
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
  artifacts:
    paths:
      - public
